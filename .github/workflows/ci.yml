name: ci

# The real test of the component is the GitLab pipeline on the mirror,
# which runs the template on itself — but only after a change is merged
# and mirrored. This holds what can be checked without GitLab, before the
# merge: the YAML parses, the pins agree, the inline sh — which runs under
# busybox on Alpine — passes shellcheck in POSIX mode, and test/e2e.sh runs
# that script with the pinned CLI against a fake server. A gocov release
# opens a bump PR here and auto-merges it when these pass, so they are
# what stands between a CLI release and the component's.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse the template and the pipeline
        run: |
          python3 - <<'PY'
          import yaml
          docs = list(yaml.safe_load_all(open("templates/upload.yml")))
          assert len(docs) == 2 and "inputs" in docs[0]["spec"], "template must be spec + one job"
          yaml.safe_load(open(".gitlab-ci.yml"))
          print("yaml ok")
          PY
      - name: Shellcheck the job script as POSIX sh
        run: |
          python3 - <<'PY' > job.sh
          import yaml
          job = list(yaml.safe_load_all(open("templates/upload.yml")))[1]
          (name, spec), = job.items()
          print("#!/bin/sh")
          for line in spec["script"]:
              print(line)
          PY
          shellcheck -s sh -e SC2086 job.sh
      - run: shellcheck test/e2e.sh
      - run: ./scripts/check-pins.sh
      # The workflows themselves, as in gocov: actionlint for mistakes
      # (shellcheck on every run: block, warnings and up), zizmor for
      # security problems, failing on medium and up (.github/zizmor.yml).
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: actionlint
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor
        run: pipx run zizmor==1.30.1 --offline --min-severity medium .github/workflows

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: PyYAML, which the arm image may not carry
        run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y -qq python3-yaml
      - run: bash test/e2e.sh
