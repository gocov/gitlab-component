name: tag-on-release-merge

# The merge half of the cross-repo bump: a gocov release opens a bump PR
# here carrying the `release` label, and merging that PR is the release
# decision — so this tags the merge commit with the version the PR's
# CHANGELOG.md entry names, creates the GitHub release, and pushes main
# plus the tag to the GitLab mirror, whose pipeline creates the CI/CD
# Catalog release from the tag.
#
# Tags are bare semver (1.2.0, no v): the catalog requires it.
#
# Only PRs actually labeled `release` do any of this; every other merge
# is ignored. The escape hatch is by hand: tag, push to both remotes.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Read the version CHANGELOG.md releases
        id: next
        # The newest `## X.Y.Z` heading is the release, as in gocov-action
        # and upload-pipe: the bump PR writes it.
        run: |
          tag=$(sed -n 's/^## \([0-9][0-9.]*\) *$/\1/p' CHANGELOG.md | head -1)
          [ -n "$tag" ] || { echo "no '## X.Y.Z' heading in CHANGELOG.md" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists — did the bump PR forget its CHANGELOG entry?" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: Tag the merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.tag }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "refs/tags/${{ steps.next.outputs.tag }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        # The notes are the version's CHANGELOG.md entry, as in gocov-action
        # and upload-pipe.
        run: |
          awk -v v="$TAG" '/^## /{f = ($2 == v); next} f' CHANGELOG.md >notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md

      - name: Mirror main and the tag to GitLab
        # The catalog reads the GitLab project, and a tag that lands only
        # on GitHub publishes nothing there. Without the secret this warns
        # instead of failing: the release itself is fine, the mirror push
        # just has to happen by hand.
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          if [ -z "$GITLAB_MIRROR_TOKEN" ]; then
            echo "::warning::GITLAB_MIRROR_TOKEN is not set — push main and tag $TAG to gitlab.com/gocov/gocov by hand"
            exit 0
          fi
          git push "https://oauth2:$GITLAB_MIRROR_TOKEN@gitlab.com/gocov/gocov.git" \
            "HEAD:refs/heads/main" "refs/tags/$TAG"
