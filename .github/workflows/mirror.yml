name: mirror

# gitlab.com/gocov/gocov is a push mirror of this repo: the CI/CD Catalog
# entry lives there and its pipeline is the component's real test. Every
# push to main goes across, and so does a hand-pushed release tag (the
# escape hatch). Tags cut by tag-on-release-merge.yml are pushed with
# GITHUB_TOKEN, which starts no workflow runs, so that workflow mirrors
# them itself.
#
# Repository secret: GITLAB_MIRROR_TOKEN — a GitLab personal access token
# scoped to the gocov/gocov project with Code: Push. Run mirror-check.yml
# after setting or rotating it.

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push to GitLab
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ -n "$GITLAB_MIRROR_TOKEN" ] || { echo "GITLAB_MIRROR_TOKEN is not set" >&2; exit 1; }
          # A branch push mirrors main; a tag push mirrors main and the tag,
          # so the GitLab pipeline that creates the catalog release sees both.
          case "$REF" in
            refs/tags/*) refs="refs/remotes/origin/main:refs/heads/main $REF:$REF" ;;
            *) refs="HEAD:refs/heads/main" ;;
          esac
          # shellcheck disable=SC2086
          git push "https://oauth2:$GITLAB_MIRROR_TOKEN@gitlab.com/gocov/gocov.git" $refs
